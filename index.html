<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>STALKEA: Analiza la actividad de Instagram de cualquier persona</title>
    <meta name="description" content="Descubre qué hace cualquier persona en Instagram de forma simple, anónima y sin contraseña." />
    <meta name="keywords" content="stalkea, Instagram, actividad de Instagram, perfiles, análisis" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="STALKEA: Analiza la actividad de Instagram" />
    <meta property="og:description" content="Descubre la verdad sobre cualquier persona accediendo a su Instagram." />
    <link rel="icon" type="image/png" href="assets/logo-vert-transparente.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <canvas id="matrix-canvas" aria-hidden="true"></canvas>
      <section class="center-stage" aria-labelledby="main-title">
        <div class="page-pad">
          <div class="content-wrap">
            <article class="glass-card">
              <div class="logo-row">
                <div class="logo-fade-in">
                  <img src="assets/logo-vert-transparente.png" alt="Logo del proyecto" />
                </div>
              </div>

              <div class="copy-block">
                <h1 id="main-title">¿Qué hace tu <span class="gradient-text">pareja</span> cuando está en Instagram?</h1>
                <h2>Descubre la verdad sobre <span class="gradient-text bold">cualquier persona</span>, accediendo a su Instagram.</h2>
              </div>

              <div class="cta-wrap">
                <button class="primary-button shimmer" id="primary-cta" type="button" aria-label="Analizar ahora">
                  <span class="button-content">
                    <svg class="eye-icon eye-blink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7Z" />
                    </svg>
                    <span>Analizar ahora</span>
                  </span>
                </button>
              </div>

              <div class="trust-row" aria-label="Beneficios">
                <div class="trust-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2Zm10-10V7a4 4 0 0 0-8 0v4h8Z" /></svg>
                  <span>100% anónimo</span>
                </div>
                <div class="trust-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 0 1 2 2m4 0a6 6 0 0 1-7.743 5.743L11 17H9v2H7v2H4a1 1 0 0 1-1-1v-2.586a1 1 0 0 1 .293-.707l5.964-5.964A6 6 0 1 1 21 9Z" /></svg>
                  <span>Sin contraseña</span>
                </div>
                <div class="trust-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m5 13 4 4L19 7" /></svg>
                  <span>Prueba gratis</span>
                </div>
              </div>
            </article>

            <p class="activity-count"><strong id="profile-count">+81.876</strong> perfiles analizados hoy (<span id="weekday">lunes</span>)</p>
          </div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="script.js"></script>
  </body>
</html>
